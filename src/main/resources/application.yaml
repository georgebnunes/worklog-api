spring:
  application:
    name: worklogapi
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        globally_quoted_identifiers: true
  flyway:
    enabled: true
    baseline-on-migrate: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Public keys of bn-auth-service. Fetched lazily on the first token and cached; refetched on an unknown `kid`.
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8080/.well-known/jwks.json}
          # Together with jwk-set-uri this does NOT trigger OIDC discovery: it only validates the `iss` claim.
          issuer-uri: ${AUTH_ISSUER:bn-auth-service}
          audiences: ${AUTH_AUDIENCE:bn-api}
          # Must match jwt.algorithm of bn-auth-service (RS256 or ES256).
          jws-algorithms: ${AUTH_JWS_ALGORITHM:RS256}
          # bn-auth-service puts roles without prefix in `roles` (["USER"]); Spring expects ROLE_USER.
          authorities-claim-name: roles
          authority-prefix: ROLE_
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
